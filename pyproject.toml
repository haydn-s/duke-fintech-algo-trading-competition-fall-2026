[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphalab"
version = "0.1.0"
description = "Research and execution loop for the Duke FinTech Trading Competition, Fall 2026"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["ib_async>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-PyYAML"]

[project.scripts]
alphalab = "alphalab.run:main"
alphalab-preflight = "alphalab.preflight:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/alphalab"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ib_async.*", "pyarrow.*"]
ignore_missing_imports = true
